  <text x="800" y="510" fill="#23e9d1" font-family="Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="18" text-anchor="middle">ARENA</text>
  <text x="800" y="790" fill="#b8bac5" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="9" text-anchor="middle">OYNA · MÜCADELE ET · EFSANE OL</text>
