<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Cyber Arena</title>
  <desc id="description">Neon cyan ve pembe ışıklarla aydınlanan bir e-spor turnuva arenası.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b16"/>
      <stop offset="0.55" stop-color="#181127"/>
      <stop offset="1" stop-color="#080b16"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#23e9d1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#23e9d1" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#23e9d1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pinkBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff1766" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff1766" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff1766" stop-opacity="0"/>
