<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turnuva Kaydı | CyberArena</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body class="page-shell">
    <header class="site-header secondary-bar">
        <a class="brand" href="./"><span class="brand-mark">CA</span><span>CYBER<span class="brand-accent">ARENA</span></span></a>
        <nav class="page-nav" aria-label="Ana menü">
            <a href="./">Ana Sayfa</a>
            <a href="kayıt.html" class="aktif">Turnuvaya Katıl</a>
            <a href="takimlar.html">Kayıtlı Oyuncular</a>
        </nav>
        <a class="header-cta" href="takimlar.html">Oyuncuları gör <span aria-hidden="true">↗</span></a>
    </header>
    <main class="form-kapsayici">
        <form id="kayitFormu" class="cyber-form" novalidate>
            <fieldset>
                <legend>Oyuncu başvuru formu</legend>
                <div class="form-grup"><label for="adSoyad">Adınız soyadınız</label><input type="text" id="adSoyad" required placeholder="Örn: Ahmet Yılmaz" /></div>
                <div class="form-grup"><label for="nickname">Oyuncu Nickname'iniz</label><input type="text" id="nickname" required pattern=".{3,}" title="En az 3 karakter giriniz" placeholder="Örn: ShadowHunter" /></div>
                <div class="form-grup"><label for="yas">Yaşınız</label><input type="number" id="yas" required min="15" max="50" placeholder="15–50" /><p class="form-hint">Turnuvaya 15–50 yaş aralığındaki oyuncular katılabilir.</p></div>
                <div class="form-grup"><label for="eposta">E-posta adresiniz</label><input type="email" id="eposta" required placeholder="ornek@mail.com" /></div>
                <div class="form-grup"><label for="oyunSecim">Yarışacağınız oyun</label><select id="oyunSecim" required><option value="">-- Oyun seçiniz --</option><option value="Valorant">Valorant</option><option value="League of Legends">League of Legends</option><option value="CS2">Counter-Strike 2</option><option value="EA Sports FC 24">EA Sports FC 24</option></select></div>
                <div class="form-grup"><label>Katılım türü</label><div class="radyo-grup"><label><input type="radio" name="katilim" value="Bireysel" checked /> Bireysel</label><label><input type="radio" name="katilim" value="Takım kaptanı" /> Takım kaptanı</label></div></div>
                <label class="terms-label"><input type="checkbox" id="kurallar" required /> Turnuva kurallarını okudum, kabul ediyorum.</label>
                <button type="submit" class="siber-buton tam-genislik">KAYDI TAMAMLA</button>
            </fieldset>
        </form>
    </main>
    <script src="./app.js?v=3"></script>
</body>
</html>
